apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-ingress-nginx
  namespace: kube-system
spec:
  valuesContent: |-
    controller:
      config:
        allow-snippet-annotations: "true"
        annotations-risk-level: "Critical"
        use-gzip: "true"
        gzip-level: "6"
        gzip-min-length: "256"
        enable-brotli: "true"
        brotli-level: "6"
        brotli-min-length: "256"
      tolerations:
        - key: "HighPriorityWorkloads"
          operator: "Exists"
          effect: "NoSchedule"
