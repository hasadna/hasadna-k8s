apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knesset-mk-tracking
spec:
  destination:
    namespace: knesset-mk-tracking
    server: https://kubernetes.default.svc
  project: knesset-mk-tracking
  source:
    path: apps/knesset-mk-tracking
    plugin:
      name: uumpa
    repoURL: https://github.com/hasadna/hasadna-k8s.git
    targetRevision: master
  syncPolicy:
    {{ if .Values.allowAutoSync }}
    automated:
      prune: true
      selfHeal: true
    {{ end }}
    syncOptions:
    - CreateNamespace=true
